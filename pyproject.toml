[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "quiche"
dynamic = ["version"]
description = "Quantitative intercellular niche enrichment"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = "MIT"

authors = [
  { name = "Jolene Ranek", email = "ranekjs@gmail.com" },
]

dependencies = [
  "anndata>=0.7.6,<0.10.9",
  "joblib>=1.3,<2",
  "networkx>=3.1,<4",
  "numba>=0.53.0",
  "numpy>=1.24,<2.2",
  "pandas>=1.5,<2.3",
  "requests>=2.31,<3",
  "scikit-learn>=1.2,<1.8",
  "scipy>=1.10,<1.16",
  "statsmodels>=0.12.2",
  "tqdm",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/jranek/quiche"
Homepage = "https://github.com/jranek/quiche"

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8,<3.11",
  "scikit-image>=0.19.2",
  "seaborn>=0.12.2",
]

full = [
  "scanpy>=1.8.1",
  "sketchKH>=0.1.2",
  "squidpy==1.6.1",
  "pertpy==0.6.0",
  "tqdm-joblib>=0.0.4,<0.1",
  "umap-learn==0.5.1",
  "jax>=0.4.13",
  "jaxlib",
  "flax",
  "chex",
]

dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<0.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/quiche"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
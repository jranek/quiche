[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "quiche"
dynamic = ["version"]
description = "Quantitative intercellular niche enrichment"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
  { name = "Jolene Ranek", email = "ranekjs@gmail.com" },
]
dependencies = [
  "anndata>=0.10,<0.12",
  "joblib>=1.3,<2",
  "networkx>=3.1,<4",
  "numba>=0.57,<0.62",
  "numpy>=1.24,<2.2",
  "pandas>=1.5,<2.3",
  "requests>=2.31,<3",
  "scikit-learn>=1.2,<1.8",
  "scipy>=1.10,<1.16",
  "statsmodels>=0.14,<0.15",
  "tqdm>=4.66,<5",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Source = "https://github.com/jranek/quiche"
Homepage = "https://github.com/jranek/quiche"

[project.optional-dependencies]
plot = [
  "matplotlib>=3.8,<3.11",
  "scikit-image>=0.22,<0.26",
  "seaborn>=0.13,<0.14",
]
full = [
  "muon>=0.1.7,<0.2",
  "pertpy>=0.9,<0.11",
  "python-igraph>=0.11,<0.12",
  "scanpy>=1.10,<1.12",
  "sketchKH>=0.1.2,<0.2",
  "squidpy>=1.6,<2",
  "tqdm-joblib>=0.0.4,<0.1",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<0.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/quiche"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
